services:
  web:
    image: node:22
    working_dir: /app
    env_file:
      - ./.env.base44-defaults
      # - /run/base44/app.env  # temporarily disabled: VITE_BASE44_APP_BASE_URL was set to the app ID, not a URL — fix the value then re-enable
    environment:
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./:/app
      - /app/node_modules
    ports:
      - "3000:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5173/', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
